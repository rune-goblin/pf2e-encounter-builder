name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          node scripts/check-lockfile.ts
          npm ci

      # After npm ci, so a version bump can never desync package.json from the lockfile's
      # root entry mid-install. All three carry the version; the tag is the source of truth.
      - name: Stamp version from tag
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          committed=$(jq -r .version module.json)
          if [ "$committed" != "$V" ]; then
            echo "::warning::committed version $committed != tag $V — bump the manifests before tagging"
          fi
          for f in module.json package.json; do
            jq --arg v "$V" '.version = $v' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          done
          jq --arg v "$V" '.version = $v | .packages."".version = $v' package-lock.json > lock.tmp
          mv lock.tmp package-lock.json

      - name: Build
        run: |
          npm run check
          npm run build

      - name: Build release zip
        run: |
          zip -r pf2e-encounter-builder.zip \
            module.json LICENSE.md README.md dist lang packs assets \
            -x "packs/_source/*" \
            -x "packs/*/LOCK" -x "packs/*/LOG" -x "packs/*/LOG.old" -x "packs/*/*.log" \
            -x "*/.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pf2e-encounter-builder.zip
            module.json
          generate_release_notes: true
